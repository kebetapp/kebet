<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kebet — Sign In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f0; color: #111; display: flex; min-height: 100vh; }
    .left { background: #1a6b3c; width: 45%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 40px; position: sticky; top: 0; height: 100vh; }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
    .logo-icon { width: 50px; height: 50px; background: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .logo-text { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: 3px; }
    .logo-am { font-size: 14px; color: #f0a500; }
    .left-title { font-size: 28px; font-weight: 700; color: #fff; text-align: center; margin-bottom: 10px; }
    .left-sub { font-size: 14px; color: rgba(255,255,255,0.7); text-align: center; margin-bottom: 40px; line-height: 1.7; }
    .stat-box { display: flex; gap: 32px; margin-top: 20px; }
    .stat { text-align: center; }
    .stat-num { font-size: 28px; font-weight: 700; color: #fff; }
    .stat-lab { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px; }
    .right { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 40px; }
    .form-box { width: 100%; max-width: 400px; }
    .form-title { font-size: 24px; font-weight: 700; color: #111; margin-bottom: 6px; }
    .form-sub { font-size: 14px; color: #888; margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; }
    label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid #eee; border-radius: 10px; font-size: 14px; color: #111; background: #fff; outline: none; transition: border 0.2s; }
    input:focus { border-color: #1a6b3c; }
    .forgot { text-align: right; margin-top: -10px; margin-bottom: 16px; }
    .forgot a { font-size: 12px; color: #1a6b3c; text-decoration: none; }
    .submit-btn { width: 100%; background: #1a6b3c; color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .submit-btn:hover { background: #145530; }
    .submit-btn:disabled { background: #aaa; cursor: not-allowed; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .divider-line { flex: 1; height: 1px; background: #eee; }
    .divider span { font-size: 12px; color: #aaa; }
    .signup-link { text-align: center; font-size: 13px; color: #888; margin-top: 16px; }
    .signup-link a { color: #1a6b3c; font-weight: 600; text-decoration: none; }
    .error-msg { background: #fff0f0; border: 1px solid #ffcccc; color: #cc0000; font-size: 12px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .success-msg { background: #e8f5ee; border: 1px solid #b2dfc6; color: #1a6b3c; font-size: 12px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    @media (max-width: 768px) { body { flex-direction: column; } .left { width: 100%; height: auto; padding: 40px 20px; position: relative; } .right { padding: 40px 20px; } }
  </style>
</head>
<body>

<div class="left">
  <div class="logo">
    <div class="logo-icon">🏠</div>
    <div><div class="logo-text">KEBET</div><div class="logo-am">ከቤት</div></div>
  </div>
  <div class="left-title">Welcome back! 👋</div>
  <div class="left-sub">Sign in to find trusted house workers near you in Addis Ababa</div>
  <div class="stat-box">
    <div class="stat"><div class="stat-num">500+</div><div class="stat-lab">Workers</div></div>
    <div class="stat"><div class="stat-num">1,200+</div><div class="stat-lab">Happy homes</div></div>
    <div class="stat"><div class="stat-num">4.9★</div><div class="stat-lab">Avg rating</div></div>
  </div>
</div>

<div class="right">
  <div class="form-box">
    <div class="form-title">Sign in to Kebet</div>
    <div class="form-sub">Enter your email and password to continue</div>

    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>

    <div class="form-group"><label>Email address</label><input type="email" id="email" placeholder="abebe@email.com" /></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Your password" /></div>
    <div class="forgot"><a href="#">Forgot password?</a></div>

    <button class="submit-btn" id="signin-btn" onclick="handleSignIn()">Sign In →</button>

    <div class="divider"><div class="divider-line"></div><span>don't have an account?</span><div class="divider-line"></div></div>
    <div class="signup-link">New to Kebet? <a href="signup.html">Create account here</a></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAuR0ccqos7BFAEXRFMfKp18LtLkmsogF8",
    authDomain: "kebet-6a12b.firebaseapp.com",
    projectId: "kebet-6a12b",
    storageBucket: "kebet-6a12b.firebasestorage.app",
    messagingSenderId: "1098491917554",
    appId: "1:1098491917554:web:94c535d8f52fd3f4d98c6b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.handleSignIn = async function() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const btn = document.getElementById('signin-btn');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!email || !password) {
      errorMsg.textContent = '⚠️ Please fill in all fields.';
      errorMsg.style.display = 'block';
      return;
    }

    btn.textContent = 'Signing in...';
    btn.disabled = true;

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      const userDoc = await getDoc(doc(db, 'users', user.uid));
      const userData = userDoc.data();

      successMsg.textContent = '✅ Welcome back! Taking you to your dashboard...';
      successMsg.style.display = 'block';

      setTimeout(() => {
        if (userData.userType === 'owner') {
          window.location.href = 'dashboard-owner.html';
        } else {
          window.location.href = 'dashboard-worker.html';
        }
      }, 1500);

    } catch (error) {
      btn.textContent = 'Sign In →';
      btn.disabled = false;
      if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
        errorMsg.textContent = '❌ Wrong email or password. Please try again.';
      } else {
        errorMsg.textContent = '❌ Error: ' + error.message;
      }
      errorMsg.style.display = 'block';
    }
  }
</script>

</body>
</html>
