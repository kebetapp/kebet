<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kebet — Find Workers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #f5f5f0; color: #111; }

    nav {
      background: #fff;
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .nav-logo-icon { width: 38px; height: 38px; background: #1a6b3c; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
    .nav-logo-text { font-size: 20px; font-weight: 600; color: #1a6b3c; letter-spacing: 2px; }
    .nav-logo-am { font-size: 13px; color: #f0a500; }
    .nav-btns { display: flex; gap: 10px; }
    .btn-outline-nav { border: 1.5px solid #1a6b3c; color: #1a6b3c; background: transparent; padding: 8px 20px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .btn-green-nav { background: #1a6b3c; color: #fff; border: none; padding: 8px 20px; border-radius: 20px; font-size: 13px; cursor: pointer; }

    .hero {
      background: linear-gradient(135deg, #1a6b3c 0%, #145530 100%);
      padding: 48px 40px 56px;
      text-align: center;
      color: #fff;
    }
    .hero h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .hero p { font-size: 15px; color: rgba(255,255,255,0.8); margin-bottom: 28px; }
    .search-bar {
      background: #fff;
      border-radius: 16px;
      padding: 8px;
      display: flex;
      gap: 8px;
      max-width: 640px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .search-bar input {
      flex: 1;
      border: none;
      outline: none;
      padding: 10px 14px;
      font-size: 14px;
      color: #111;
    }
    .search-bar select {
      border: none;
      outline: none;
      padding: 10px 14px;
      font-size: 14px;
      color: #555;
      background: #f5f5f0;
      border-radius: 10px;
      cursor: pointer;
    }
    .search-bar button {
      background: #1a6b3c;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .filters-bar {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 12px 40px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }
    .filter-chip {
      border: 1.5px solid #eee;
      background: #fff;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      color: #555;
      transition: all 0.15s;
    }
    .filter-chip:hover, .filter-chip.active { background: #1a6b3c; color: #fff; border-color: #1a6b3c; }

    .main { max-width: 1140px; margin: 0 auto; padding: 28px 40px 60px; }
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .results-count { font-size: 14px; color: #888; }
    .sort-select { border: 1.5px solid #eee; border-radius: 10px; padding: 7px 14px; font-size: 13px; outline: none; cursor: pointer; background: #fff; color: #555; }

    .worker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .worker-card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      border: 1.5px solid #eee;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .worker-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(26,107,60,0.10);
      border-color: #1a6b3c;
    }

    .worker-top { display: flex; gap: 14px; align-items: flex-start; }
    .worker-av {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: #fde8c8;
      color: #c87800;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700;
      flex-shrink: 0;
    }
    .worker-name { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 2px; }
    .worker-role { font-size: 13px; color: #555; margin-bottom: 2px; }
    .worker-loc { font-size: 12px; color: #1a6b3c; margin-bottom: 6px; }
    .live-in-tag {
      display: inline-block;
      background: #fff5e0;
      color: #c87800;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .verified {
      background: #e8f5ee;
      color: #1a6b3c;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      align-self: flex-start;
      white-space: nowrap;
    }

    .worker-skills { display: flex; gap: 6px; flex-wrap: wrap; }
    .skill-tag {
      background: #f5f5f0;
      color: #555;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .worker-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid #f5f5f0;
    }
    .stars { font-size: 13px; color: #f0a500; margin-top: 2px; }
    .hire-btn {
      background: #1a6b3c;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .hire-btn:hover { background: #145530; }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      grid-column: 1 / -1;
    }
    .empty-icon { font-size: 56px; margin-bottom: 16px; }
    .empty-title { font-size: 20px; font-weight: 700; color: #111; margin-bottom: 8px; }
    .empty-sub { font-size: 14px; color: #888; }

    .loading-state { text-align: center; padding: 80px 20px; grid-column: 1 / -1; color: #888; font-size: 16px; }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center;
      z-index: 999;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 24px;
      padding: 32px;
      max-width: 420px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 20px; font-weight: 700; color: #111; margin-bottom: 4px; }
    .modal-sub { font-size: 13px; color: #888; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 11px 14px; border: 1.5px solid #eee; border-radius: 10px; font-size: 14px; outline: none; }
    .form-input:focus { border-color: #1a6b3c; }
    .svc-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
    .svc-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; }
    .total-box {
      background: #e8f5ee;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #1a6b3c;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }
    .error-box {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #cc0000;
      font-size: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: none;
    }
    .modal-btns { display: flex; gap: 10px; }
    .btn-cancel { flex: 1; background: #f5f5f0; color: #555; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-confirm { flex: 1; background: #1a6b3c; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }

    @media (max-width: 768px) {
      nav { padding: 16px 20px; }
      .hero { padding: 32px 20px 40px; }
      .hero h1 { font-size: 24px; }
      .filters-bar { padding: 12px 20px; }
      .main { padding: 20px 20px 40px; }
      .search-bar { flex-wrap: wrap; }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="kebet-lang.css"/>
  <script src="kebet-lang.js"></script>
  <link rel="stylesheet" href="kebet-smooth.css"/>
  <script src="kebet-smooth.js"></script>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="window.location.href='index.html'">
    <div class="nav-logo-icon">🏠</div>
    <div>
      <div class="nav-logo-text">KEBET</div>
      <div class="nav-logo-am">ከቤት</div>
    </div>
  </div>
  <div class="nav-btns">
        <div class="lang-toggle" style="margin-left:auto;">
  <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
  <button class="lang-btn" id="btn-am" onclick="setLang('am')">አማ</button>
</div>
    <button class="btn-outline-nav" onclick="window.location.href='signin.html'"><span class="en">Sign in</span><span class="am">ግባ</span></button>
    <button class="btn-green-nav" onclick="window.location.href='signup.html'"><span class="en">Get Started</span><span class="am">ጀምር</span></button>

</nav>

<div class="hero">

  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Search by name, skill..." oninput="filterWorkers()" />
    <select id="location-filter" onchange="filterWorkers()">

<div class="filters-bar">
  <button class="filter-chip active" onclick="setSkillFilter('', this)"><span class="en">All Workers</span><span class="am">ሁሉም ሰራተኞች</span></button>

  <button class="filter-chip" onclick="setSkillFilter('Laundry', this)">👕 Laundry</button>
  <button class="filter-chip" onclick="setSkillFilter('Gardening', this)">🌿 Gardening</button>
  <button class="filter-chip" onclick="setSkillFilter('Full-time', this)">🏠 Full-time</button>
</div>

<div class="main">
  <div class="results-header">
    <div class="results-count" id="results-count">Loading workers...</div>
    <select class="sort-select" id="sort-select" onchange="filterWorkers()">
      <option value="newest">Newest first</option>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAuR0ccqos7BFAEXRFMfKp18LtLkmsogF8",
    authDomain: "kebet-6a12b.firebaseapp.com",
    projectId: "kebet-6a12b",
    storageBucket: "kebet-6a12b.firebasestorage.app",
    messagingSenderId: "1098491917554",
    appId: "1:1098491917554:web:94c535d8f52fd3f4d98c6b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let allWorkers = [];
  let salaryFilter = 'any';
  let customMax = null;

  async function loadWorkers() {
    try {
      // Load ALL workers — rules now allow public read of users
      const snap = await getDocs(query(
        collection(db, 'users'),
        where('userType', '==', 'worker')
      ));

      allWorkers = [];
      snap.forEach(d => {
        allWorkers.push({ id: d.id, ...d.data() });
      });

      if (allWorkers.length === 0) {
        document.getElementById('workers-grid').innerHTML = '';
        document.getElementById('no-results').style.display = 'block';
        document.getElementById('no-results').innerHTML = '<div style="font-size:40px; margin-bottom:12px;">👷</div><div>No workers registered yet. Check back soon!</div>';
        document.getElementById('result-count').textContent = '0';
      } else {
        filterWorkers();
      }
    } catch (err) {
      document.getElementById('workers-grid').innerHTML = '';
      document.getElementById('no-results').style.display = 'block';
      document.getElementById('no-results').innerHTML = '<div style="font-size:40px; margin-bottom:12px;">❌</div><div>Error loading workers: ' + err.message + '</div>';
      console.error('Error loading workers:', err);
    }
  }

  window.setSalFilter = function(type) {
    salaryFilter = type;
    customMax = null;
    document.getElementById('custom-max') && (document.getElementById('custom-max').value = '');
    document.querySelectorAll('.sal-filter-btn').forEach(b => b.classList.remove('active'));
    const map = { any:'sal-any', 'under2000':'sal-1', '2000-3000':'sal-2', '3000-4500':'sal-3', 'above4500':'sal-4' };
    if (map[type]) document.getElementById(map[type])?.classList.add('active');
    filterWorkers();
  }

  window.setCustomMax = function(val) {
    customMax = val ? parseInt(val) : null;
    salaryFilter = 'custom';
    document.querySelectorAll('.sal-filter-btn').forEach(b => b.classList.remove('active'));
    filterWorkers();
  }

  window.filterWorkers = function() {
    const search = (document.getElementById('search-input')?.value || '').toLowerCase();
    const location = document.getElementById('location-filter')?.value || '';
    const onlyVerified = document.getElementById('f-verified')?.checked || false;
    const only5star = document.getElementById('f-r5')?.checked || false;
    const only4star = document.getElementById('f-r4')?.checked || false;
    const sortVal = document.getElementById('sort-select')?.value || 'rating';

    const categories = [];
    if (document.getElementById('f-clean')?.checked) categories.push('cleaning');
    if (document.getElementById('f-cook')?.checked) categories.push('cooking');
    if (document.getElementById('f-nanny')?.checked) categories.push('nanny');
    if (document.getElementById('f-laundry')?.checked) categories.push('laundry');
    if (document.getElementById('f-full')?.checked) categories.push('full');

    let filtered = allWorkers.filter(w => {
      const fullName = ((w.firstName || '') + ' ' + (w.lastName || '')).toLowerCase();
      const skill = (w.skill || '').toLowerCase();
      const workerSalary = parseInt(w.expectedSalary || w.salary || 0);
      const rating = parseFloat(w.rating || 0);

      if (search && !fullName.includes(search) && !skill.includes(search)) return false;
      if (location && w.location !== location) return false;
      if (onlyVerified && !w.verified) return false;
      if (only5star && rating < 5.0) return false;
      if (only4star && rating < 4.0) return false;

      if (categories.length > 0) {
        const skillLower = skill;
        const match = categories.some(cat => {
          if (cat === 'cleaning') return skillLower.includes('clean');
          if (cat === 'cooking') return skillLower.includes('cook');
          if (cat === 'nanny') return skillLower.includes('nanny') || skillLower.includes('child');
          if (cat === 'laundry') return skillLower.includes('laundry');
          if (cat === 'full') return skillLower.includes('full');
          return false;
        });
        if (!match) return false;
      }

      if (workerSalary > 0) {
        if (salaryFilter === 'under2000' && workerSalary >= 2000) return false;
        if (salaryFilter === '2000-3000' && (workerSalary < 2000 || workerSalary > 3000)) return false;
        if (salaryFilter === '3000-4500' && (workerSalary < 3000 || workerSalary > 4500)) return false;
        if (salaryFilter === 'above4500' && workerSalary <= 4500) return false;
        if (salaryFilter === 'custom' && customMax && workerSalary > customMax) return false;
      }

      return true;
    });

    if (sortVal === 'low') filtered.sort((a, b) => (parseInt(a.expectedSalary || a.salary || 0)) - (parseInt(b.expectedSalary || b.salary || 0)));
    else if (sortVal === 'high') filtered.sort((a, b) => (parseInt(b.expectedSalary || b.salary || 0)) - (parseInt(a.expectedSalary || a.salary || 0)));
    else filtered.sort((a, b) => (parseFloat(b.rating || 0)) - (parseFloat(a.rating || 0)));

    const grid = document.getElementById('workers-grid');
    const noResults = document.getElementById('no-results');
    document.getElementById('result-count').textContent = filtered.length;

    if (filtered.length === 0) {
      grid.innerHTML = '';
      noResults.style.display = 'block';
      return;
    }

    noResults.style.display = 'none';

    const colors = ['av-gold', 'av-green', 'av-blue', 'av-pink'];
    grid.innerHTML = filtered.map((w, i) => {
      const fullName = ((w.firstName || '') + ' ' + (w.lastName || '')).trim();
      const initials = ((w.firstName?.[0] || '') + (w.lastName?.[0] || '')).toUpperCase();
      const skill = w.skill || 'House Worker';
      const location = w.location || '—';
      const salary = parseInt(w.expectedSalary || w.salary || 0);
      const rating = parseFloat(w.rating || 0);
      const stars = rating > 0 ? '★'.repeat(Math.round(rating)) + '☆'.repeat(5 - Math.round(rating)) : '☆☆☆☆☆';
      const color = colors[i % colors.length];
      const verified = w.verified ? '<div class="verified">✓ Verified</div>' : '';

      return `
        <div class="worker-card" onclick="window.location.href='profile.html?id=${w.id}'">
          <div class="worker-top">
            <div class="worker-av ${color}">${initials}</div>
            <div>
              <div class="worker-name">${fullName}</div>
              <div class="worker-role">${skill}</div>
              <div class="worker-loc">📍 ${location}, Addis Ababa</div>
              <span class="live-in-tag">🛏️ Live-in</span>
            </div>
            ${verified}
          </div>
          <div class="worker-skills"><span class="skill">${skill}</span></div>
          <div class="worker-bottom">
            <div>
              <div class="worker-salary">${salary > 0 ? salary.toLocaleString() + ' ETB' : 'Negotiable'} <span>/month</span></div>
              <div class="stars">${stars} ${rating > 0 ? rating.toFixed(1) : 'New'}</div>
            </div>
            <button class="hire-btn" onclick="event.stopPropagation(); window.location.href='profile.html?id=${w.id}'">Hire now</button>
          </div>
        </div>`;
    }).join('');
  }

  // Load workers immediately — no auth needed since rules allow public read
  loadWorkers();
</script>

</body>
</html>
